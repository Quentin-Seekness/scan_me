<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR</title>
  <!-- Link Libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- Link CSS -->
  <link href="css/ar-interface.css" rel="stylesheet" />
  <link href="css/model-controls.css" rel="stylesheet" />
  <!-- Link custom JS (components must be registered before the scene is built) -->
  <script src="js/model-controls.js" type="text/javascript"></script>
  <!-- Builds the scene from experiences/<exp>.json (index.html?exp=visit-cards) -->
  <script src="js/experience-loader.js" type="text/javascript"></script>
</head>

<body>
  <!-- Scanning overlay, shown by MindAR while no target is found -->
  <div id="scan-overlay" class="hidden">
    <div class="scan-frame">
      <span class="corner top-left"></span>
      <span class="corner top-right"></span>
      <span class="corner bottom-left"></span>
      <span class="corner bottom-right"></span>
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint">Visez la cible</div>
  </div>

  <!-- Shown while the model of a found target is downloading -->
  <div id="model-loading" class="hidden">Chargement du modèle…</div>

  <!-- Shown when the experience config cannot be loaded -->
  <div id="experience-error" class="hidden"></div>

  <!-- 3D model controls -->
  <!-- Shown only when a target is found and its model is displayed -->
  <div id="model-controls" class="hidden">
    <!-- Shown only when the displayed model has animations -->
    <div id="model-animation-controls" class="group hidden">
      <button id="model-play-button">▶ Démarrer</button>
      <button id="model-pause-button">⏸ Arrêter</button>
      <button id="model-restart-button">↺ Redémarrer</button>
    </div>
    <div class="group">
      <button id="model-smaller-button">－ Réduire</button>
      <span id="model-scale-label">100%</span>
      <button id="model-bigger-button">＋ Agrandir</button>
      <button id="model-reset-rotation-button">⟲ Réinitialiser</button>
    </div>
  </div>

  <!-- The a-scene is built by js/experience-loader.js -->
</body>

</html>
