<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Link Libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- Link CSS -->
  <link href="css/model-controls.css" rel="stylesheet" />
  <!-- Link custom JS (must be loaded before the scene to register the components) -->
  <script src="js/model-controls.js" type="text/javascript"></script>
</head>

<body>
  <!-- 3D model controls -->
  <div id="model-controls">
    <div class="group">
      <button id="model-play-button">▶ Démarrer</button>
      <button id="model-pause-button">⏸ Arrêter</button>
      <button id="model-restart-button">↺ Redémarrer</button>
    </div>
    <div class="group">
      <button id="model-smaller-button">－ Réduire</button>
      <span id="model-scale-label">100%</span>
      <button id="model-bigger-button">＋ Agrandir</button>
    </div>
  </div>

  <a-scene mindar-image="imageTargetSrc: assets/visit_cards.mind; maxTrack: 1; filterMinCF:0.1; filterBeta: 0.001;"
    color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- Change src to display another 3D model -->
      <a-asset-item id="arModel" src="assets/models/animated_low_poly_fish.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 1 1" intensity="2"></a-light>

    <!-- One anchor per image of visit_cards.mind : any detected card shows the model -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#arModel" position="0 0 0.1" animated-model></a-gltf-model>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#arModel" position="0 0 0.1" animated-model></a-gltf-model>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#arModel" position="0 0 0.1" animated-model></a-gltf-model>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 3">
      <a-gltf-model src="#arModel" position="0 0 0.1" animated-model></a-gltf-model>
    </a-entity>
  </a-scene>
</body>

</html>
